<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>刘品川 · 个人简历</title>
    <style>
        /* ===== CSS Variables & Reset ===== */
        :root {
            --color-primary: #2563eb;
            --color-primary-light: #3b82f6;
            --color-primary-dark: #1d4ed8;
            --color-accent: #0ea5e9;
            --color-bg: #f8fafc;
            --color-bg-card: #ffffff;
            --color-text: #0f172a;
            --color-text-secondary: #475569;
            --color-border: #e2e8f0;
            --color-shadow: rgba(0, 0, 0, 0.06);
            --radius: 12px;
            --transition: 0.2s ease;
            --max-width: 1120px;
            --nav-height: 68px;
            --avatar-size: 110px;
        }

        [data-theme="dark"] {
            --color-bg: #0f172a;
            --color-bg-card: #1e293b;
            --color-text: #f1f5f9;
            --color-text-secondary: #94a3b8;
            --color-border: #334155;
            --color-shadow: rgba(0, 0, 0, 0.3);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            padding-top: var(--nav-height);
            transition: background 0.3s, color 0.3s;
        }

        a {
            color: var(--color-primary);
            text-decoration: none;
            transition: color var(--transition);
        }
        a:hover {
            color: var(--color-primary-dark);
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--color-border);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-primary-light);
            border-radius: 8px;
        }

        /* ===== Container ===== */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ===== Navigation ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: var(--color-bg-card);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 1000;
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
            box-shadow: 0 1px 4px var(--color-shadow);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .navbar .logo {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            color: var(--color-primary);
        }
        .navbar .logo span {
            color: var(--color-text);
        }
        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
            list-style: none;
            flex-wrap: wrap;
        }
        .navbar .nav-links a {
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
            color: var(--color-text-secondary);
            transition: background var(--transition), color var(--transition);
        }
        .navbar .nav-links a:hover {
            background: var(--color-border);
            color: var(--color-text);
        }
        .navbar .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar .nav-actions button {
            background: none;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 1.1rem;
            cursor: pointer;
            color: var(--color-text-secondary);
            transition: background var(--transition), color var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .navbar .nav-actions button:hover {
            background: var(--color-border);
            color: var(--color-text);
        }
        .navbar .nav-actions .print-btn {
            font-size: 1rem;
        }

        /* ===== Hero ===== */
        .hero {
            padding: 40px 0 32px;
            text-align: center;
            border-bottom: 1px solid var(--color-border);
            margin-bottom: 32px;
            background: linear-gradient(145deg, var(--color-bg-card), var(--color-bg));
            border-radius: 0 0 var(--radius) var(--radius);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hero .avatar {
            width: var(--avatar-size);
            height: var(--avatar-size);
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--color-primary-light);
            box-shadow: 0 8px 24px var(--color-shadow);
            margin-bottom: 16px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .hero .avatar:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 32px rgba(37, 99, 235, 0.25);
        }
        .hero h1 {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
        }
        .hero .subtitle {
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            margin-top: 8px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .hero .tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
        }
        .hero .tags .badge {
            background: var(--color-border);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            transition: background var(--transition), transform var(--transition);
        }
        .hero .tags .badge:hover {
            background: var(--color-primary-light);
            color: #fff;
            transform: translateY(-2px);
        }
        .hero .contact-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px 20px;
            margin-top: 20px;
            font-size: 0.95rem;
            color: var(--color-text-secondary);
        }
        .hero .contact-row .item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .hero .contact-row .item .icon {
            font-size: 1.1rem;
        }
        .hero .contact-row .copy-btn {
            background: none;
            border: none;
            color: var(--color-primary);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 2px 8px;
            border-radius: 4px;
            transition: background var(--transition);
        }
        .hero .contact-row .copy-btn:hover {
            background: var(--color-border);
        }

        /* ===== Highlights ===== */
        .highlights {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }
        .highlights .hl-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 18px 16px;
            text-align: center;
            transition: transform var(--transition), box-shadow var(--transition);
            box-shadow: 0 2px 8px var(--color-shadow);
        }
        .highlights .hl-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px var(--color-shadow);
        }
        .highlights .hl-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-primary);
            line-height: 1.2;
        }
        .highlights .hl-card .label {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            margin-top: 4px;
        }

        /* ===== Section ===== */
        .section {
            margin-bottom: 48px;
        }
        .section-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 3px solid var(--color-primary);
            display: inline-block;
            letter-spacing: -0.3px;
        }

        /* ===== Tabs ===== */
        .tabs {
            margin-top: 8px;
        }
        .tabs-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            border-bottom: 2px solid var(--color-border);
            margin-bottom: 20px;
        }
        .tabs-nav button {
            background: none;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: color var(--transition), border-color var(--transition), background var(--transition);
            border-radius: 6px 6px 0 0;
        }
        .tabs-nav button:hover {
            color: var(--color-text);
            background: var(--color-border);
        }
        .tabs-nav button[aria-selected="true"] {
            color: var(--color-primary);
            border-bottom-color: var(--color-primary);
            font-weight: 600;
        }
        .tabs-panel {
            display: none;
            animation: fadeUp 0.25s ease;
        }
        .tabs-panel[role="tabpanel"] {
            display: none;
        }
        .tabs-panel.active {
            display: block;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Cards ===== */
        .card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 2px 8px var(--color-shadow);
            transition: transform var(--transition), box-shadow var(--transition);
            margin-bottom: 20px;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px var(--color-shadow);
        }
        .card-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 10px;
        }
        .card-header h3 {
            font-size: 1.15rem;
            font-weight: 600;
        }
        .card-header .meta {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
        }
        .card .company {
            font-weight: 500;
            color: var(--color-primary);
            font-size: 0.95rem;
        }
        .card ul {
            list-style: none;
            padding: 0;
            margin-top: 10px;
        }
        .card ul li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: var(--color-text-secondary);
            line-height: 1.7;
        }
        .card ul li::before {
            content: "▸";
            position: absolute;
            left: 0;
            color: var(--color-primary);
            font-weight: 700;
        }
        .card ul li strong {
            color: var(--color-text);
        }

        /* ===== Project Grid ===== */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .project-grid .card {
            display: flex;
            flex-direction: column;
            margin-bottom: 0;
        }
        .project-grid .card .tech {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0 8px;
        }
        .project-grid .card .tech span {
            background: var(--color-border);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            color: var(--color-text-secondary);
        }
        .project-grid .card .result {
            margin-top: auto;
            font-size: 0.9rem;
            color: var(--color-primary);
            font-weight: 500;
        }

        /* ===== Skills ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .skills-grid .skill-group {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: 0 2px 8px var(--color-shadow);
        }
        .skills-grid .skill-group h4 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--color-primary);
        }
        .skills-grid .skill-group .skill-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            padding: 4px 0;
            color: var(--color-text-secondary);
        }
        .skills-grid .skill-group .skill-item .bar {
            width: 100px;
            height: 4px;
            background: var(--color-border);
            border-radius: 4px;
            overflow: hidden;
            margin-left: 12px;
        }
        .skills-grid .skill-group .skill-item .bar .fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--color-primary-light), var(--color-accent));
            transition: width 0.6s ease;
        }

        /* ===== Education & Awards ===== */
        .edu-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 2px 8px var(--color-shadow);
            margin-bottom: 20px;
        }
        .edu-card .row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
        }
        .edu-card .row .left {
            font-weight: 600;
            font-size: 1.05rem;
        }
        .edu-card .row .right {
            color: var(--color-text-secondary);
            font-size: 0.9rem;
        }
        .edu-card .detail {
            margin-top: 10px;
            color: var(--color-text-secondary);
            font-size: 0.95rem;
            line-height: 1.7;
        }
        .edu-card .detail .highlight {
            color: var(--color-primary);
            font-weight: 500;
        }

        .awards-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-top: 12px;
        }
        .awards-list .award-tag {
            background: var(--color-border);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            transition: background var(--transition), transform var(--transition);
        }
        .awards-list .award-tag:hover {
            background: var(--color-primary-light);
            color: #fff;
            transform: translateY(-2px);
        }

        /* ===== Footer ===== */
        .footer {
            border-top: 1px solid var(--color-border);
            padding: 24px 0 32px;
            margin-top: 16px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--color-text-secondary);
        }
        .footer .update {
            margin-top: 4px;
            font-size: 0.8rem;
        }

        /* ===== Back to Top ===== */
        .back-top {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
            transition: transform var(--transition), opacity var(--transition), visibility var(--transition);
            opacity: 0;
            visibility: hidden;
            transform: translateY(12px);
            z-index: 999;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .back-top.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .back-top:hover {
            transform: scale(1.08);
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .navbar .nav-links a {
                font-size: 0.75rem;
                padding: 4px 8px;
            }
            .navbar .logo {
                font-size: 1rem;
            }
            .hero h1 {
                font-size: 2rem;
            }
            .hero .subtitle {
                font-size: 0.95rem;
            }
            .hero .avatar {
                --avatar-size: 80px;
                width: var(--avatar-size);
                height: var(--avatar-size);
            }
            .highlights {
                grid-template-columns: repeat(2, 1fr);
            }
            .project-grid {
                grid-template-columns: 1fr;
            }
            .skills-grid {
                grid-template-columns: 1fr;
            }
            .tabs-nav button {
                padding: 8px 14px;
                font-size: 0.85rem;
            }
            .card-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .hero .contact-row {
                font-size: 0.85rem;
                gap: 8px 14px;
            }
            .back-top {
                bottom: 20px;
                right: 20px;
                width: 38px;
                height: 38px;
                font-size: 1rem;
            }
            .container {
                padding: 0 16px;
            }
        }
        @media (max-width: 480px) {
            .navbar {
                flex-wrap: wrap;
                height: auto;
                padding: 8px 12px;
                gap: 4px;
            }
            .navbar .nav-links {
                gap: 2px;
            }
            .navbar .nav-actions button {
                padding: 4px 6px;
                font-size: 0.9rem;
            }
            body {
                padding-top: 80px;
            }
            .highlights {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .highlights .hl-card .number {
                font-size: 1.5rem;
            }
            .hero {
                padding: 24px 0 20px;
            }
            .hero h1 {
                font-size: 1.7rem;
            }
            .hero .avatar {
                --avatar-size: 70px;
                width: var(--avatar-size);
                height: var(--avatar-size);
            }
        }

        /* ===== Print ===== */
        @media print {
            body {
                padding-top: 0 !important;
                background: #fff !important;
                color: #000 !important;
            }
            .navbar,
            .back-top,
            .nav-actions {
                display: none !important;
            }
            .card,
            .edu-card,
            .skill-group,
            .hl-card {
                box-shadow: none !important;
                border: 1px solid #ddd !important;
                break-inside: avoid;
            }
            .card:hover,
            .hl-card:hover {
                transform: none !important;
            }
            .hero {
                background: #f5f7fa !important;
                border-bottom: 1px solid #ddd !important;
            }
            .tabs-nav button {
                border-bottom: 2px solid transparent !important;
            }
            .tabs-nav button[aria-selected="true"] {
                border-bottom-color: #2563eb !important;
            }
            .project-grid {
                grid-template-columns: 1fr 1fr;
            }
            .highlights {
                grid-template-columns: repeat(4, 1fr);
            }
            .section {
                margin-bottom: 24px;
            }
            .container {
                max-width: 100% !important;
                padding: 0 20px !important;
            }
            .footer {
                border-top: 1px solid #ddd !important;
            }
            .hero .contact-row .copy-btn {
                display: none;
            }
            .skills-grid .skill-group .skill-item .bar {
                border: 1px solid #ddd;
                background: #eee;
            }
            .skills-grid .skill-group .skill-item .bar .fill {
                background: #2563eb !important;
            }
            .hero .avatar {
                border: 2px solid #2563eb !important;
                box-shadow: none !important;
            }
        }

        /* ===== Reduced Motion ===== */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .tabs-panel {
                animation: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- ===== NAVIGATION ===== -->
    <nav class="navbar" role="navigation" aria-label="主导航">
        <div class="logo">刘品川 <span>· 简历</span></div>
        <ul class="nav-links">
            <li><a href="#section-hero">首页</a></li>
            <li><a href="#section-highlights">亮点</a></li>
            <li><a href="#section-experience">经历</a></li>
            <li><a href="#section-projects">项目</a></li>

        <div class="nav-actions">

        </div>
    </nav>

    <!-- ===== MAIN ===== -->
    <main class="container" id="app">
        <!-- All sections will be rendered by JS -->
    </main>

    <!-- ===== BACK TO TOP ===== -->
    <button class="back-top" aria-label="返回顶部" title="返回顶部">↑</button>

    <script>

        // ============================================================
        const resume = {

        // ---- Tab switching ----
        function switchTab(type, id, idx) {
            const container = document.getElementById(type === 'exp' ? 'exp-tabs' : 'proj-tabs');
            if (!container) return;
            const nav = container.querySelector('.tabs-nav');
            const panels = container.querySelectorAll('.tabs-panel');
            const buttons = nav.querySelectorAll('button');
            buttons.forEach((b, i) => {
                b.setAttribute('aria-selected', i === idx ? 'true' : 'false');
            });
            panels.forEach((p, i) => {
                p.classList.toggle('active', i === idx);
            });
        }

        // ---- Section helper ----
        function createSection(id) {
            const section = document.createElement('section');
            section.id = id;
            section.className = 'section';
            return section;
        }

        // ============================================================
        //  THEME TOGGLE
        // ============================================================
        function initTheme() {
            const stored = localStorage.getItem('theme') || 'light';
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = stored === 'dark' ? 'dark' : (stored === 'light' ? 'light' : (prefersDark ? 'dark' : 'light'));
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            updateThemeBtn();
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeBtn();
        }

        function updateThemeBtn() {
            const btn = document.querySelector('.theme-toggle');
            if (btn) {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                btn.textContent = isDark ? '☀️' : '🌓';
                btn.setAttribute('aria-label', isDark ? '切换到浅色模式' : '切换到深色模式');
            }
        }

        // ============================================================
        //  BACK TO TOP
        // ============================================================
        function initBackTop() {
            const btn = document.querySelector('.back-top');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 400) {
                    btn.classList.add('visible');
                } else {
                    btn.classList.remove('visible');
                }
            });
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        // ============================================================
        //  PRINT
        // ============================================================
        function initPrint() {
            document.querySelector('.print-btn').addEventListener('click', () => {
                window.print();
            });
        }

        // ============================================================
        //  SMOOTH ANCHOR
        // ============================================================
        function initSmoothAnchor() {
            document.querySelectorAll('.nav-links a').forEach(link => {
                link.addEventListener('click', function(e) {
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        e.preventDefault();
                        const offset = 70;
                        const top = target.getBoundingClientRect().top + window.scrollY - offset;
                        window.scrollTo({ top, behavior: 'smooth' });
                    }
                });
            });
        }

        // ============================================================
        //  INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            render();
            initTheme();
            initBackTop();
            initPrint();
            initSmoothAnchor();

            document.querySelector('.theme-toggle').addEventListener('click', toggleTheme);

            // Fix tabs after render (ensure first tab active)
            document.querySelectorAll('.tabs').forEach(tabContainer => {
                const firstBtn = tabContainer.querySelector('.tabs-nav button');
                if (firstBtn) {
                    const panels = tabContainer.querySelectorAll('.tabs-panel');
                    panels.forEach((p, i) => {
                        p.classList.toggle('active', i === 0);
                    });
                    firstBtn.setAttribute('aria-selected', 'true');
                }
            });
        });
    </script>
